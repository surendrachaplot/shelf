name: shelf
options:
  bundleIdPrefix: com.surendrachaplot
  deploymentTarget: { iOS: "17.0" }
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: CBFCJ37VBT
targets:
  shelf:
    type: application
    platform: iOS
    sources: [Sources, Resources, Core/Sources/ShelfCore]
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: shelf
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSPhotoLibraryUsageDescription: "shelf reads the pictures you pick so it can save them. Pictures are read once and never stored on a server."
        NSLocationWhenInUseUsageDescription: "Used to show saved places that are near you. Your location stays on this phone."
        CFBundleURLTypes:
          - CFBundleURLName: com.surendrachaplot.shelf
            CFBundleURLSchemes: [shelf]
        # Baked the way eas.json baked them into the Expo build.
        ShelfAPI: https://shelf-api-u8xy.onrender.com
    settings:
      base:
        # THE SAME ID AS THE EXPO APP, on purpose: installed over it, this app
        # opens the same Documents folder and so the same shelf.json. Nothing
        # is migrated because nothing moved.
        PRODUCT_BUNDLE_IDENTIFIER: com.surendrachaplot.shelf
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Config/shelf.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: ShelfShare
  ShelfShare:
    type: app-extension
    platform: iOS
    sources: [ShareExtension, Sources/Design, Core/Sources/ShelfCore/ShareQueue.swift]
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: shelf
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 10
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.surendrachaplot.shelf.ShareExtension
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Config/ShelfShare.entitlements
        TARGETED_DEVICE_FAMILY: "1"
  ShelfTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: shelf
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.surendrachaplot.shelf.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/shelf.app/shelf"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  shelf:
    build:
      targets: { shelf: all, ShelfTests: [test] }
    test:
      targets: [ShelfTests]
