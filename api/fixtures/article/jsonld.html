  "headline": "Why the swifts came back late this year",
  "author": [{"@type": "Person", "name": "Priya Raman"}, {"@type": "Person", "name": "Dan Okafor"}],

  "description": "A cold, wet May held the birds south of the Alps for nearly three weeks.",
  "articleBody": "The swifts that nest under the eaves of the old grain store arrived on the nineteenth of May this year, eighteen days later than the average for the last decade.\nThey were not lost. Ringing records from two stations in northern Italy show the same birds waiting out a run of cold fronts that sat over central Europe for most of the month.\nSwifts feed only on the wing, on insects carried up by warm air. A week of rain at ten degrees means nothing is flying, and a bird that crosses the mountains into that weather arrives hungry at a place with no food.\nSo they wait. What looks from the ground like lateness is a decision, made every morning, that today is still not the day.\nThe cost comes afterwards. A pair that starts three weeks late has three weeks less to raise a brood before the insects thin out in August, and this year most of the nests we watch held two chicks, not three.\nWhether that matters depends on whether it happens again. One late spring is weather. Five in a decade would be something else, and it is why somebody has stood under that roof with a notebook every May since 1998."
