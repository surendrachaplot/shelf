# Build the app, from a machine that can reach Expo.
#
# WHY THIS EXISTS: `npm run ship` needs a shell on a machine with network
# access to api.expo.dev, and the sandbox this repo is written in denies that
# host at the gateway. Same shape as the diagnose workflow — put the command on
# a runner and read the job log — except this one produces an installable file
# at the end of it.
#
# ANDROID IS THE REASON IT EXISTS NOW. An iOS build needs an Apple account and
# a device UDID; an Android APK needs neither, so this is the one platform that
# can go from a push to something on a phone without anybody signing anything.
#
# ONE-TIME SETUP: repository secret `EXPO_TOKEN` (already set — the OTA update
# workflow uses the same one).
name: Build the app

on:
  workflow_dispatch:
    inputs:
      what:
        description: "Start a build, or just ask what happened to the last one"
        required: true
        default: build
        type: choice
        options: [build, status]
      platform:
        description: "Which platform to build"
        required: true
        default: android
        type: choice
        options: [android, ios, all]
      profile:
        description: "EAS build profile"
        required: true
        default: preview
        type: choice
        options: [preview, development]

jobs:
  build:
    runs-on: ubuntu-latest
    # An Android build is 10-25 minutes on the free tier's queue. The default
    # job timeout is six hours, but a queue that never moves should not hold a
    # runner all afternoon.
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # The link to the build page is the ONLY way to read why a build failed
      # before the log expires, and it was coming out as
      # accounts/null/projects/null — `eas build --json` does not always carry
      # `.project.ownerAccount.name` or `.project.slug`. These are the values
      # from app/app.json, used as the fallback. Three Android failures went
      # undiagnosed behind that dead link.
      EAS_OWNER: surendrachaplot
      EAS_SLUG: shelf
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Check the token is set
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is not set on this repository. Settings → Secrets and variables → Actions. Create the token at https://expo.dev/settings/access-tokens"
            exit 1
          fi

      - run: npm ci

      # The same gate the local build runs, and it now covers Android: the
      # share-intent plugin being Android-only, the package name, the adaptive
      # icon, expo-system-ui, and the APK-not-AAB build type. Ten minutes of
      # queue is a slow way to be told about a missing icon.
      - run: npm run preflight

      # WHY THIS EXISTS: an EAS build runs on Expo's servers, not here. When the
      # free-tier queue is long the runner can hit its own timeout while the
      # build carries on perfectly happily — and killing the runner does not
      # kill the build. `status` asks Expo what actually happened, in twenty
      # seconds, instead of starting a second build to find out.
      # CHANNEL AND RUNTIME VERSION ARE ON THIS LIST FOR A REASON.
      #
      # An installed build only ever sees updates published to ITS channel and
      # ITS runtime version. Get either wrong and the app on the phone stays
      # frozen at the JS it was built with — no error, no prompt, nothing in
      # any log, and every publish reporting success. That is exactly how a
      # phone spent three days showing "Couldn't reach your shelves", a string
      # deleted from this repo on 2026-08-10, while four updates published
      # cleanly to a channel it was not listening to.
      #
      # `eas.json` has TWO profiles on two channels. Whichever one is on the
      # phone is the one that matters, and it is not knowable from here.
      - name: What happened to the last builds
        if: inputs.what == 'status'
        run: |
          npx --yes eas-cli@latest build:list \
            --platform "${{ inputs.platform }}" --limit 8 --non-interactive --json 2>/dev/null \
            | jq -r '.[] | "\(.status)  \(.platform)  \(.createdAt)\n  profile: \(.buildProfile // "—")   channel: \(.channel // "—")   runtime: \(.runtimeVersion // "—")\n  install: \(.artifacts.buildUrl // "—")\n  page:    https://expo.dev/accounts/\(.project.ownerAccount.name // env.EAS_OWNER)/projects/\(.project.slug // env.EAS_SLUG)/builds/\(.id)\n"'

      # And which updates each channel can actually see.
      - name: What each channel is pointed at
        if: inputs.what == 'status'
        run: |
          echo "── channels → branches ──"
          npx --yes eas-cli@latest channel:list --non-interactive --json 2>/dev/null \
            | jq -r '.[] | "\(.name) → \(.updateBranches[]?.name // "—")"' || echo "(channel:list unavailable)"
          echo
          echo "── the newest update on each branch ──"
          for b in preview development; do
            echo "  $b:"
            npx --yes eas-cli@latest update:list --branch "$b" --limit 1 --non-interactive --json 2>/dev/null \
              | jq -r '.currentPage[]? | "    runtime \(.runtimeVersion)  \(.createdAt)  \(.message)"' || echo "    (none)"
          done

      - name: Build
        if: inputs.what == 'build'
        id: build
        run: |
          set -o pipefail
          npx --yes eas-cli@latest build \
            --platform "${{ inputs.platform }}" \
            --profile "${{ inputs.profile }}" \
            --non-interactive \
            --json 2>&1 | tee /tmp/build.json

      # WHEN A BUILD FAILS, PRINT WHY — HERE, NOW.
      #
      # `eas build` reports `EAS_BUILD_UNKNOWN_GRADLE_ERROR` and tells you to
      # "see the logs for the Run gradlew phase". Those logs are on Expo's
      # storage behind a SIGNED URL THAT EXPIRES IN 15 MINUTES, and the URL is
      # only ever printed inside the failing run's JSON. So by the time anyone
      # reads the failure, the only thing that explains it is gone, and the
      # answer is another 25-minute build.
      #
      # The URLs are still valid at this instant. Fetch them now.
      - name: Why the build failed
        if: failure() && inputs.what == 'build'
        run: |
          if [ ! -s /tmp/build.json ]; then echo "no build output"; exit 0; fi
          # `eas build --json` still prints human progress lines to the same
          # stream, so the file is NOT valid JSON — it is prose, then a JSON
          # array. Feeding the whole thing to jq fails with "Invalid numeric
          # literal at line 1", which is what happened the first time this ran
          # and is why the gradle log went uncaptured. Slice from the first
          # line that is a bare `[` to the end.
          sed -n '/^\[/,$p' /tmp/build.json > /tmp/build.array.json
          if ! jq -e . /tmp/build.array.json >/dev/null 2>&1; then
            echo "could not find a JSON array in the build output — last 40 lines:"
            tail -40 /tmp/build.json
            exit 0
          fi
          jq -r '.[] | select(.status != "FINISHED") | "\(.platform): \(.error.errorCode // "?") — \(.error.message // "no message")"' /tmp/build.array.json || true
          echo
          for URL in $(jq -r '.[].logFiles[]?' /tmp/build.array.json); do
            echo "════ $(echo "$URL" | sed 's/?.*//' | awk -F/ '{print $NF}') ════"
            # -f so a 403 on an expired link is loud rather than 40 lines of XML.
            curl -sfL "$URL" | tail -60 || echo "(could not fetch this log — the signed URL may have expired)"
            echo
          done

      # The whole point of the run: a link somebody can open on a phone. Pulled
      # out of the JSON so it is the last thing in the log rather than the
      # thing you scroll a build transcript to find.
      - name: Where to install it
        if: always() && inputs.what == 'build'
        run: |
          if [ ! -s /tmp/build.json ]; then echo "no build output"; exit 0; fi
          # --json prints an array of builds (one per platform). Anything that
          # is not JSON — an error, a prompt — falls through to the raw tail.
          sed -n '/^\[/,$p' /tmp/build.json > /tmp/build.array.json
          if jq -e . /tmp/build.array.json >/dev/null 2>&1; then
            jq -r '.[] | "platform: \(.platform)\nstatus:   \(.status)\ninstall:  \(.artifacts.buildUrl // .artifacts.applicationArchiveUrl // "—")\npage:     https://expo.dev/accounts/\(.project.ownerAccount.name // env.EAS_OWNER)/projects/\(.project.slug // env.EAS_SLUG)/builds/\(.id)"' /tmp/build.array.json
          else
            echo "--- not JSON, last 40 lines ---"
            tail -40 /tmp/build.json
          fi
