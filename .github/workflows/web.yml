# The web app, published.
#
# WHY THIS EXISTS. The iOS build quota ran out on 2026-08-16 and does not reset
# until 1 September, so nothing written after that date could reach a phone.
# The same App.tsx runs in a browser — six native modules swapped in
# app/web/ — and a browser needs no build quota, no signing and no App Store.
#
# WHAT IS PUBLISHED. A static site: one HTML file, one bundle, a manifest, an
# icon. No server. The shelves live in localStorage on whoever's browser it is,
# exactly as they live in a file on whoever's phone it is.
#
# THE ADDRESS. GitHub Pages, so it is free and it exists today:
#   https://surendrachaplot.github.io/shelf/
# A bought domain is a CNAME away — add `cname:` to actions/configure-pages and
# point the DNS. Nothing in the app hardcodes the address.
#
# IT IS CHECKED BEFORE IT IS PUBLISHED. `web/check.mjs` loads the built site in
# a real browser, saves a note, reloads, and fails the job if what was typed is
# gone. A static site that deploys and cannot save is the worst outcome
# available here, and it is invisible to any "did it build" test.
name: Web app

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, newest wins. Two pushes a minute apart otherwise race
# and the older one can land last.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci

      # `enablement: true` turns Pages on for the repository the first time
      # this runs, so nobody has to find the setting.
      - uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: true

      - name: Build the site
        run: node web/build.mjs
        env:
          SHELF_WEB_URL: ${{ steps.pages.outputs.base_url }}

      # A real browser, driving the real output. Chrome is preinstalled on the
      # runner image; if it ever is not, the check SAYS it skipped rather than
      # passing silently — a check that quietly does nothing is worse than no
      # check, because the green tick still gets believed.
      - name: Does it actually work
        run: |
          if [ -x /usr/bin/google-chrome ]; then
            CHROME_PATH=/usr/bin/google-chrome node web/check.mjs
          else
            echo "::warning::SKIPPED the browser check — no chrome at /usr/bin/google-chrome on this runner"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/web-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      - run: echo "shelf is at ${{ steps.deployment.outputs.page_url }}"
