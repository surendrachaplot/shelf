# Put a WORKING update back on the phone, now.
#
# WHY THIS EXISTS: an update was published whose JavaScript imports native code
# the installed binary does not contain. `expo-share-intent` pulls in
# `expo-linking`, whose module does `requireNativeModule('ExpoLinking')` at the
# top level — no optional variant, no guard — so the bundle THROWS while it is
# being evaluated, before a single component renders.
#
# When that happens `expo-updates` does the sensible thing and falls back to the
# EMBEDDED bundle: the JavaScript baked into the binary at build time. On this
# phone that is the build of 2026-08-11 13:12Z, which is four hours older than
# the local-first rewrite — so the app quietly reverted to the version that
# fetched shelves from a server, and said "Couldn't reach your shelves", because
# the server it is asking has had no shelves since that rewrite.
#
# From outside it looks like the app lost everything. Nothing was lost: the
# shelf file is still on the phone, untouched, because the code that reads it
# never got to run.
#
# `eas update:rollback` is not enough on its own — it needs to know WHICH group
# was the last good one, and that is a question about the phone's binary, not
# about git. So this lists first and republishes second, deliberately in two
# steps with a human choosing between them.
name: Put a working update back

on:
  workflow_dispatch:
    inputs:
      action:
        description: "list = show recent updates per branch. republish = push a chosen group back to the top."
        required: true
        default: list
        type: choice
        options: [list, republish]
      group:
        description: "Update group ID to republish (from the list). Required for republish."
        required: false
        type: string

jobs:
  recover:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Newest first. The one to go back to is the last one published BEFORE
      # the first update that imported the missing native module — read the
      # messages, they are commit subjects.
      - name: What has been published
        if: inputs.action == 'list'
        run: |
          for BRANCH in preview development; do
            echo "══ $BRANCH ══"
            eas update:list --branch "$BRANCH" --limit 12 --non-interactive --json 2>/dev/null \
              | jq -r '.currentPage[]? | "  group \(.group)\n    runtime \(.runtimeVersion)   \(.message)"' \
              || echo "  (no updates on this branch)"
            echo
          done

      # Republishing puts an OLD bundle at the TOP of a branch, so the next
      # launch takes it. It does not delete anything — the broken update stays
      # in the history where it can be read.
      #
      # `--group` and `--branch` are MUTUALLY EXCLUSIVE, which cost a failed
      # run: a group already knows which branch it belongs to, so `--group`
      # alone republishes it onto its own branch. Reaching a DIFFERENT branch
      # is a separate flag, and the name has moved between eas-cli versions —
      # so the help is printed first and the fallbacks are explicit rather
      # than assumed. Guessing a flag from memory is what produced the failure
      # this comment exists under.
      - name: The flags this version of eas-cli actually has
        if: inputs.action == 'republish'
        run: eas update:republish --help || true

      - name: Republish that group
        if: inputs.action == 'republish'
        run: |
          if [ -z "${{ inputs.group }}" ]; then
            echo "::error::republish needs a group ID. Run this with action=list first."
            exit 1
          fi
          GROUP="${{ inputs.group }}"

          # 1. Back onto its own branch. This is the one that matters — it is
          #    the branch the group was published to in the first place.
          echo "── republishing $GROUP onto its own branch"
          eas update:republish --group "$GROUP" \
            --message "Back to a bundle this binary can actually run" \
            --non-interactive
          echo "OK: republished onto its own branch"

          # 2. And onto the other one, if this eas-cli can. A phone on the
          #    other channel took the broken bundle too, so this is not
          #    optional — but the flag name varies, so try both spellings and
          #    say plainly if neither worked rather than reporting success.
          DONE=""
          for FLAG in --destination-branch --target-branch; do
            echo "── trying $FLAG development"
            if eas update:republish --group "$GROUP" "$FLAG" development \
                 --message "Back to a bundle this binary can actually run" \
                 --non-interactive; then
              DONE="$FLAG"
              break
            fi
          done
          if [ -n "$DONE" ]; then
            echo "OK: also republished to development via $DONE"
          else
            echo "::warning::could not republish to the development branch — see the help output above for the right flag"
          fi

          echo
          echo "Force-quit the app and open it TWICE — expo-updates downloads on one launch and applies on the next."
