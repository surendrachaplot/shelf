# Push to main → the app on the phone updates itself.
#
# EAS Update ships JavaScript and assets to an already-installed build. It
# CANNOT ship native code, so this workflow checks first and refuses to publish
# when a change needs a rebuild. That refusal is the point: publishing anyway
# succeeds, the app takes the update, and the native change is silently absent —
# which is far harder to diagnose than a red tick here.
name: Can this update travel over the air?

on:
  push:
    branches: [main]
    paths: ["app/**"]
  workflow_dispatch:
    inputs:
      anyway:
        description: "Publish the JS even though something in this range needs a rebuild. The native part will be ABSENT until you build."
        type: boolean
        default: false

jobs:
  update:
    runs-on: ubuntu-latest
    # The `secrets` context is NOT available in a step's `if:` — only github,
    # needs, env, steps and a few others are. Mapping it to an env var here is
    # what makes "is this configured?" answerable at all; the first version
    # checked `env.EXPO_TOKEN != ''` and would have silently never
    # published.
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          # native-changed.mjs diffs this push against what came before it.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      # `ci`, not `install` — the same strictness EAS itself uses, so a
      # lockfile that has drifted fails here instead of on a build machine.
      - run: npm ci

      # Everything the local build gate checks: the expo-share-extension major
      # against the Expo SDK, the Swift import that has failed three builds,
      # lockfile sync, config-plugin order, the entry-point names, and whether
      # eas.json and api.ts agree on a server.
      - run: npm run preflight

      - name: Can this travel over the air?
        id: native
        run: |
          set +e
          # `before` is all zeros on the first push to a branch, and a manual
          # run has no `before` at all — fall back rather than diff against
          # nothing and crash.
          BEFORE="${{ github.event.before }}"
          case "$BEFORE" in
            ""|0000000000000000000000000000000000000000) RANGE="HEAD~1..HEAD" ;;
            *) RANGE="$BEFORE..${{ github.sha }}" ;;
          esac
          echo "range: $RANGE"
          echo "range=$RANGE" >> "$GITHUB_OUTPUT"
          node native-changed.mjs "$RANGE"
          CODE=$?
          # 3 means "this push changed nothing under app/". On a PUSH that is
          # correct and there is nothing to do. On a MANUAL run it is the wrong
          # answer to the wrong question: somebody has asked for a publish, and
          # what they want on the phone is the current state of app/, not the
          # diff of the last commit. This is how a manual publish silently did
          # nothing after four commits of API work.
          if [ "$CODE" = "3" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "manual run: publishing the current state of app/ regardless of this commit's diff"
            CODE=0
          fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          set -e

      - name: Nothing to publish
        if: steps.native.outputs.code == '3'
        run: echo "No app changes in this push."

      # A PUSH never publishes a native change silently. That is the whole
      # point of this job and it does not get an override.
      # A PUSH NEVER PUBLISHES A NATIVE CHANGE SILENTLY — but refusing on
      # purpose is a DECISION, not a failure, and it must not be red.
      #
      # It was. Every push touching app/ since the picker landed has emailed a
      # failure for a workflow doing exactly its job, and a pipeline that is
      # permanently red next to the ones that matter teaches you to ignore red
      # — which is the same reasoning that deleted .eas/workflows/update.yml.
      # A notice on the summary says it clearly and the run stays green.
      - name: Not publishing — this needs a build
        if: steps.native.outputs.code == '1' && !(github.event_name == 'workflow_dispatch' && inputs.anyway)
        run: |
          echo "::notice::No update published: this range changes native code, which an over-the-air update cannot carry. Build and install instead."
          {
            echo "### No update published"
            echo
            echo "This range changes **native code**, so an over-the-air update cannot carry it."
            echo "That is this job working, not failing."
            echo
            echo "- to ship the app: build it and install the build"
            echo "- to ship the JavaScript now and accept the native part being absent:"
            echo "  re-run this workflow manually with **anyway** ticked"
          } >> "$GITHUB_STEP_SUMMARY"

      # The informed override. It exists because "refuse everything" is the
      # wrong answer when a range is 40 JavaScript files plus one build-time
      # env var: the JS is worth having today, and the missing piece is inert
      # until a rebuild. It is a MANUAL, explicit, logged choice — never
      # something a push can do by itself.
      - name: Publishing anyway, with the native part missing
        if: steps.native.outputs.code == '1' && github.event_name == 'workflow_dispatch' && inputs.anyway
        run: |
          echo "::warning::Publishing JS only. Everything native in this range is ABSENT from the app until \`npm run ship\`."
          node native-changed.mjs "${{ steps.native.outputs.range }}" || true

      # No token → skip, do not fail. An unconfigured optional workflow that
      # goes red on every push trains you to ignore red, which costs more than
      # the automation was worth.
      - name: Publishing from CI is not set up
        if: steps.native.outputs.code == '0' && env.EXPO_TOKEN == ''
        run: |
          echo "::notice::Publishable. EAS Workflows publishes this if the repo is connected at expo.dev; otherwise run \`npm run update\` from app/."

      - uses: expo/expo-github-action@v8
        if: (steps.native.outputs.code == '0' || (steps.native.outputs.code == '1' && inputs.anyway)) && env.EXPO_TOKEN != ''
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # ── THE CHECK THAT WOULD HAVE PREVENTED THE OUTAGE ────────────────────
      #
      # `native-changed.mjs` above asks "does THIS PUSH add native code". It
      # worked: it refused the push that added expo-share-intent. The next
      # push had a clean range and the same guard waved through a bundle that
      # imports the package the previous push was refused for.
      #
      # The question that matters is cumulative, and it is about a BINARY:
      # does the JS we are about to publish need anything the installed build
      # does not contain. So this compares HEAD against the commit that build
      # was made from, read from EAS because it is not a fact git holds.
      #
      # It cost a day. The app did not error on the phone — it silently
      # reverted to the JavaScript baked in at build time, which predated the
      # local-first rewrite, so it asked a server for shelves that no longer
      # exist and reported "Couldn't reach your shelves".
      - name: Can the installed build RUN this bundle?
        if: (steps.native.outputs.code == '0' || (steps.native.outputs.code == '1' && inputs.anyway)) && env.EXPO_TOKEN != ''
        run: |
          BUILT_FROM=$(eas build:list --limit 1 --status finished --non-interactive --json 2>/dev/null \
            | jq -r '.[0].gitCommitHash // empty')
          if [ -z "$BUILT_FROM" ]; then
            echo "::error::Could not read the last build's commit from EAS. Unknown is not safe — refusing to publish."
            exit 1
          fi
          echo "last finished build was made from $BUILT_FROM"
          # The commit may be older than the checkout depth. fetch-depth: 0 is
          # set above, but a build from a deleted branch would still be absent.
          git cat-file -e "$BUILT_FROM^{commit}" 2>/dev/null || {
            echo "::error::commit $BUILT_FROM is not in this clone — cannot compare. Refusing to publish."
            exit 1
          }
          node update-safety.mjs "$BUILT_FROM"

      # PUBLISH TO EVERY CHANNEL A BUILD COULD BE ON.
      #
      # `eas.json` has two profiles — `development` and `preview` — on two
      # channels of the same names, and an installed build only ever sees
      # updates published to ITS channel. This published to `preview` alone,
      # so a phone carrying a development build was frozen at the JS it was
      # built with while every publish here reported success.
      #
      # It is not a theory. A device spent three days showing "Couldn't reach
      # your shelves" — a string deleted from this repo on 2026-08-10, when
      # shelves stopped coming from a server at all — through four clean
      # publishes it was never going to receive. There is no error for this on
      # the phone and no line in any log: the app simply never changes.
      #
      # Both profiles carry identical env and identical code. The only thing
      # the split buys is a way to strand a build, so both get everything.
      # `--branch` is created on first use, so a channel nobody has built for
      # costs one no-op publish and nothing else.
      - name: Publish
        if: (steps.native.outputs.code == '0' || (steps.native.outputs.code == '1' && inputs.anyway)) && env.EXPO_TOKEN != ''
        run: |
          # From git, not from the event. `github.event.head_commit` does not
          # exist on a manual run, so the message expanded to "" and eas
          # refused: "--branch and --message are required". And %s is the
          # SUBJECT only — these commit bodies are long and full of quotes and
          # newlines, none of which belong on a one-line update label.
          MSG=$(git log -1 --pretty=%s)
          FAILED=""
          for BRANCH in preview development; do
            echo "── publishing to $BRANCH: $MSG"
            eas update --branch "$BRANCH" --message "$MSG" || FAILED="$FAILED $BRANCH"
          done
          # A branch that fails is reported, not swallowed. Half a publish
          # looking green is the failure this whole change is about.
          if [ -n "$FAILED" ]; then
            echo "::error::failed to publish to:$FAILED"
            exit 1
          fi
