# Ask the deployed service a question, from a machine Claude can drive.
#
# WHY THIS EXISTS: the agent sandbox this repo is written in has an egress
# policy that denies `onrender.com`, `api.expo.dev` and `instagram.com` at the
# gateway. So every "run this curl and paste the output" round trip was a human
# being used as a network cable. A GitHub runner has none of those
# restrictions, and its job logs are readable through the GitHub API — so
# Claude triggers this and reads the answer itself.
#
# ONE-TIME SETUP: add a repository secret `SHELF_ADMIN_SECRET` with the same
# value as ADMIN_SECRET on the Render service.
#   GitHub → Settings → Secrets and variables → Actions → New repository secret
name: Diagnose the deployed service

on:
  workflow_dispatch:
    inputs:
      what:
        description: "What to ask"
        required: true
        default: health
        type: choice
        options: [health, reel, resolve, recover]
      url:
        description: "The reel URL (what=reel or resolve)."
        required: false
        type: string

env:
  # The service. Kept here rather than in a secret: it is in the app binary and
  # printed on every share link, so hiding it would be theatre.
  SHELF_API: https://shelf-api-u8xy.onrender.com

jobs:
  ask:
    runs-on: ubuntu-latest
    steps:
      # `health` is public and needs nothing, so this workflow can be proven to
      # work before any secret exists. `resolve` is the app's own endpoint and
      # takes the app key, not the admin secret — so only `reel` needs this.
      - name: Check the secret is set
        if: inputs.what == 'reel'
        run: |
          if [ -z "${{ secrets.SHELF_ADMIN_SECRET }}" ]; then
            echo "::error::SHELF_ADMIN_SECRET is not set on this repository. Settings → Secrets and variables → Actions → New repository secret, name SHELF_ADMIN_SECRET, value = ADMIN_SECRET from Render."
            exit 1
          fi

      # The free tier sleeps after ~15 minutes idle and takes up to a minute to
      # get back up. Waking it first means the real request is not the one that
      # eats the cold start and times out.
      - name: Wake the server
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -m 30 "$SHELF_API/api/health" || echo 000)
            echo "attempt $i: $code"
            [ "$code" = "200" ] && break
            sleep 10
            [ "$i" = "6" ] && echo "::warning::server did not answer 200 while waking — asking anyway"
          done
          # WHICH BUILD IS ABOUT TO ANSWER. Render deploys a push in a couple of
          # minutes; a diagnosis triggered straight after one measures the old
          # code and reads as a failed fix. Printed before the question so the
          # answer can never be misread as being about the commit you just made.
          live=$(curl -sS -m 30 "$SHELF_API/api/health" | jq -r '.commit // "unknown"')
          echo "deployed commit: $live   ·   this workflow: ${GITHUB_SHA:0:7}"
          if [ "$live" != "unknown" ] && [ "$live" != "${GITHUB_SHA:0:7}" ]; then
            echo "::warning::the service is running $live, not ${GITHUB_SHA:0:7} — if you just pushed, wait for the deploy and re-run"
          fi

      - name: Ask
        env:
          SECRET: ${{ secrets.SHELF_ADMIN_SECRET }}
          APP_KEY: ${{ secrets.SHELF_APP_KEY }}
          WHAT: ${{ inputs.what }}
          URL: ${{ inputs.url }}
        run: |
          set -o pipefail
          # THE BROWSER'S DOOR, checked from outside. The web app cannot call
          # this service without these headers, and a browser refuses BEFORE
          # sending, so the failure never reaches a server log — it exists only
          # in somebody's console as "blocked by CORS policy". Ten lines here
          # is the difference between knowing and guessing.
          if [ "$WHAT" = "health" ]; then
            echo "--- CORS preflight ---"
            head=$(curl -sS -i -m 30 -X OPTIONS \
              -H "Origin: https://surendrachaplot.github.io" \
              -H "Access-Control-Request-Method: POST" \
              -H "Access-Control-Request-Headers: content-type, x-shelf-key" \
              "$SHELF_API/api/resolve" | tr -d '\r')
            echo "$head" | grep -i "^HTTP/\|^access-control" || true
            echo "$head" | grep -qi "access-control-allow-origin" \
              || echo "::warning::no CORS headers — the web app cannot call this build. Is the deploy older than the commit that added them?"
            echo "$head" | grep -qi "access-control-allow-headers:.*x-shelf-key" \
              || echo "::warning::x-shelf-key is not in the allowed headers — the web app will break the moment SHELF_APP_KEY is set"
          fi

          # THE APP ITSELF. This service serves the web build at /app, so a
          # deploy that boots and answers /api/health can still be serving a
          # 503 to every person trying to use the thing. One curl.
          if [ "$WHAT" = "health" ]; then
            echo "--- the web app at /app ---"
            code=$(curl -sS -o /tmp/app.html -w '%{http_code}' -m 30 "$SHELF_API/app/")
            size=$(wc -c < /tmp/app.html | tr -d ' ')
            echo "GET /app/ -> $code, $size bytes"
            [ "$code" = "200" ] || echo "::warning::/app/ answered $code — the web build may not be in this deploy"
            grep -qi '<div id="root">' /tmp/app.html || echo "::warning::/app/ did not return the app's HTML"
            bcode=$(curl -sS -o /dev/null -w '%{http_code}' -m 60 "$SHELF_API/app/bundle.js")
            echo "GET /app/bundle.js -> $bcode"
            [ "$bcode" = "200" ] || echo "::warning::the bundle is missing — the page will paint nothing"
          fi

          # WHAT COULD BE PUT BACK. Somebody deleted the app, which on a
          # local-first design takes the shelf file with it. Two places may
          # still hold rows: the legacy server table from the account era
          # (never wiped), and any snapshot deliberately published.
          #
          # COUNTS ONLY, NEVER TITLES. This repository is public and its
          # Actions logs are world-readable — printing what somebody reads
          # would publish it. The numbers say whether a rescue is worth
          # building; the rescue itself moves the data device-to-device.
          if [ "$WHAT" = "recover" ]; then
            echo "── legacy rows still on the server ──"
            curl -sS -m 60 "$SHELF_API/api/legacy/export" \
              | jq '{ok, count, note, by_list: (.items // [] | group_by(.list) | map({list: .[0].list, n: length}))}'
            echo
            echo "── published snapshots ──"
            curl -sS -m 30 "$SHELF_API/api/health" | jq '.published'
            exit 0
          fi

          case "$WHAT" in
            health) path="/api/health" ;;
            reel)
              if [ -z "$URL" ]; then
                echo "::error::what=reel needs a url input"; exit 1
              fi
              # --get --data-urlencode so a reel URL with its own query string
              # cannot be mistaken for extra parameters of ours.
              path="/api/debug/reel"
              curl -sS -m 120 --get --data-urlencode "url=$URL" \
                -H "x-shelf-secret: $SECRET" "$SHELF_API$path" | tee /tmp/out.json | jq . || cat /tmp/out.json
              exit 0
              ;;
            resolve)
              # THE WHOLE ROUND TRIP, exactly as the phone makes it: scrape,
              # Claude, then the catalogues. `reel` shows what Instagram gave;
              # this shows what a person would end up with on a shelf, which
              # is the only claim worth making.
              if [ -z "$URL" ]; then
                echo "::error::what=resolve needs a url input"; exit 1
              fi
              # jq builds the body, so a URL containing quotes or backslashes
              # cannot break out of the JSON.
              jq -n --arg u "$URL" '{url:$u}' > /tmp/body.json
              curl -sS -m 180 -X POST "$SHELF_API/api/resolve" \
                -H "content-type: application/json" \
                ${APP_KEY:+-H "x-shelf-key: $APP_KEY"} \
                --data @/tmp/body.json | tee /tmp/out.json | jq . || cat /tmp/out.json
              # A summary under the dump, because eight items of full JSON is
              # a page you scroll past. `enriched` false everywhere means the
              # names came out but nothing was found for them — a different
              # failure from no items at all, and invisible without this.
              echo "--- what landed ---"
              jq -r '"resolver=\(.resolver) caption_chars=\(.caption_chars) tagged_handles=\(.tagged_handles) items=\(.items|length)",
                     (.items[]? | "  [\(.list)] \(.title // "—") — \(.subtitle // "") · enriched=\(.enriched) conf=\(.confidence)\(if .canonical.asked_as then "   ⟵ ASKED FOR: \(.canonical.asked_as)" else "" end)")' \
                /tmp/out.json || true
              exit 0
              ;;
          esac
          curl -sS -m 60 -H "x-shelf-secret: $SECRET" "$SHELF_API$path" | tee /tmp/out.json | jq . || cat /tmp/out.json
