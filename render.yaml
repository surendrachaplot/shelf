# Two processes, one database. The worker is not optional: without it every
# share sits at "Working it out…" forever and /api/health goes 503 after ten
# minutes, which is the whole point of that check.
#
# rootDir IS THE REPOSITORY ROOT, not `api`. It used to be `api`, and that would
# have shipped a server that cannot boot: `api/page.js` renders the public
# shared pages from `app/src/design.js` and `app/src/exlibris.js` — the SAME
# files the app imports, which is the only arrangement where a link you send
# somebody looks like the app it came from. With rootDir: api those imports
# point outside the deploy root and the process dies on its first require.
# `api/page.js --selftest` asserts this file still says so.
services:
  - type: web
    name: shelf-api
    env: node
    buildCommand: cd api && npm ci
    startCommand: node api/serve.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: shelf-db, property: connectionString }
      - key: ANTHROPIC_API_KEY
        sync: false
      - { key: TMDB_API_KEY, sync: false }
      - { key: GOOGLE_PLACES_KEY, sync: false }
      - { key: ADMIN_SECRET, sync: false }
      # Where share links point. The app builds every URL it hands out from
      # this, so a mismatch here produces links that 404 on arrival. Set it to
      # this service's own URL — the pages and the JSON come out of one process.
      - { key: SHELF_WEB_BASE, sync: false }
      # Set to 1 if you deleted the worker service (free tier). See below.
      - { key: WORKER_IN_PROCESS, value: "0" }

  # PAID INSTANCE REQUIRED. Render's free tier has no background workers.
  #
  # On the free tier, delete this service and set WORKER_IN_PROCESS=1 on
  # shelf-api instead — the same drain runs on a timer inside the web process.
  # That is not a violation of the "nothing slow on the request path" rule: a
  # timer is not the request path, and `for update skip locked` makes running
  # both at once safe rather than racy. /api/health reports which arrangement
  # it believes it is in, so the two cannot silently disagree.
  - type: worker
    name: shelf-worker
    env: node
    buildCommand: cd api && npm ci
    startCommand: node api/worker.js
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: shelf-db, property: connectionString }
      - key: ANTHROPIC_API_KEY
        sync: false
      - { key: TMDB_API_KEY, sync: false }
      - { key: GOOGLE_PLACES_KEY, sync: false }

databases:
  - name: shelf-db
    plan: free
